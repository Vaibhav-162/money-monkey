name: Check IPO allotment status

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  allotment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check allotment status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python scripts/check_allotment.py --out data

      - name: Commit audit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/live_audit_log.csv ]; then
            git add data/live_audit_log.csv
          fi
          if git diff --staged --quiet; then
            echo "no allotment changes"
            exit 0
          fi
          git commit -m "chore: update allotment notification flags"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
