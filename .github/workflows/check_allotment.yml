name: Check IPO allotment status

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print results only, do not write the audit log or send mail/Telegram. Uncheck to force a real send."
        type: boolean
        default: true
  # External clock only (cron-job.org POST to /dispatches, ~12:00 PM IST
  # weekdays). This is the ONLY automatic trigger for this workflow —
  # GitHub's internal `schedule` trigger was removed because public-repo
  # schedule ticks were unreliable (multi-hour delays, dropped ticks).
  # There is now no automatic backup: if cron-job.org itself misses this
  # POST, nothing runs until a human notices and clicks "Run workflow"
  # with dry_run unchecked. This trigger always runs live; it ignores
  # workflow_dispatch's dry_run input.
  repository_dispatch:
    types: [trigger-check-allotment]

permissions:
  contents: write

jobs:
  allotment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check allotment status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          PAN_PROFILES: ${{ secrets.PAN_PROFILES }}
        run: >
          python scripts/check_allotment.py --out data
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit audit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/live_audit_log.csv ]; then
            git add data/live_audit_log.csv
          fi
          if git diff --staged --quiet; then
            echo "no allotment changes"
            exit 0
          fi
          git commit -m "chore: update allotment notification flags"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
