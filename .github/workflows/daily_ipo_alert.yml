name: Daily IPO close-day alert

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print cards only, do not write the audit log or send mail/Telegram. Uncheck to force a real send."
        type: boolean
        default: true
  # External clock only (cron-job.org POST to /dispatches, ~3:30 PM IST
  # weekdays). This is the ONLY automatic trigger for this workflow —
  # GitHub's internal `schedule` trigger was removed because public-repo
  # schedule ticks were unreliable (multi-hour delays, dropped ticks).
  # There is now no automatic backup: if cron-job.org itself misses this
  # POST, nothing runs until a human notices and clicks "Run workflow"
  # with dry_run unchecked. This trigger always runs live; it ignores
  # workflow_dispatch's dry_run input.
  repository_dispatch:
    types: [trigger-daily-ipo-alert]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scan and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: >
          python scripts/live_scanner.py --out data
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit audit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tolerate a day with zero closing IPOs, where the audit CSV is
          # never touched (or, on a fresh checkout, never yet created).
          if [ -f data/live_audit_log.csv ]; then
            git add data/live_audit_log.csv
          fi
          if [ -f data/live_alert_state.json ]; then
            git add data/live_alert_state.json
          fi
          if git diff --staged --quiet; then
            echo "no audit changes"
            exit 0
          fi
          git commit -m "chore: update live IPO audit log"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
