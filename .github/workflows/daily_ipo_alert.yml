name: Daily IPO close-day alert

on:
  schedule:
    # 3:15 PM IST (09:45 UTC) — hedge tick; GitHub Actions `schedule` runs on
    # public repos are sometimes delayed several hours, especially right at
    # the top of an hour. This gives an earlier chance to land on time.
    - cron: "45 9 * * 1-5"
    # 3:30 PM IST (10:00 UTC) — primary scan while the bidding window is still open.
    - cron: "0 10 * * 1-5"
    # 4:00 PM IST (10:30 UTC) — catch-up if GitHub dropped the 3:30 tick (presence-only).
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print cards only, do not write the audit log or send mail/Telegram. Uncheck to force a real send."
        type: boolean
        default: true
  # External clock (cron-job.org POST /dispatches). Runs live, same as
  # schedule — does not use workflow_dispatch.inputs.dry_run.
  repository_dispatch:
    types: [trigger-daily-ipo-alert]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scan and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: >
          python scripts/live_scanner.py --out data
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit audit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tolerate a day with zero closing IPOs, where the audit CSV is
          # never touched (or, on a fresh checkout, never yet created).
          if [ -f data/live_audit_log.csv ]; then
            git add data/live_audit_log.csv
          fi
          if [ -f data/live_alert_state.json ]; then
            git add data/live_alert_state.json
          fi
          if git diff --staged --quiet; then
            echo "no audit changes"
            exit 0
          fi
          git commit -m "chore: update live IPO audit log"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
